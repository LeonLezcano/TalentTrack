<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TalentTrack - Gestión Integral de RRHH & Competencias</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👥</text></svg>">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2563eb">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./src/styles/app.css">
</head>
<body class="h-full flex flex-col font-sans text-slate-800 antialiased selection:bg-blue-500 selection:text-white">

  <!-- Encabezado de Navegación & Control Multi-Empresa (no-print) -->
  <header class="no-print bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-40 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        
        <!-- Logo e Identidad -->
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-xl font-black shadow-inner">
            TT
          </div>
          <div>
            <div class="flex items-center gap-2">
              <span class="font-extrabold text-lg tracking-tight">TalentTrack</span>
              <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-blue-500/30 text-blue-300 border border-blue-400/30">v1.0.00</span>
            </div>
            <p class="text-[10px] text-slate-400 hidden sm:block">SaaS de Recursos Humanos & Matriz de Competencias</p>
          </div>
        </div>

        <!-- Selector Multi-Empresa & Selector de Rol -->
        <div class="flex items-center gap-2 sm:gap-4">
          <div class="relative">
            <select id="company-selector" class="bg-slate-800 text-slate-200 text-xs font-semibold rounded-xl px-3 py-2 border border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
              <!-- Opciones inyectadas dinámicamente -->
            </select>
          </div>

          <div class="relative hidden sm:block">
            <select id="role-selector" class="bg-blue-900/60 text-blue-200 text-xs font-semibold rounded-xl px-3 py-2 border border-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="HR_ADMIN">👑 Rol: Panel RRHH</option>
              <option value="EMPLOYEE">📱 Rol: Portal Colaborador</option>
            </select>
          </div>

          <!-- Campana de Alertas Preventivas -->
          <button data-action="switch-tab" data-id="dashboard" class="relative p-2 text-slate-400 hover:text-white rounded-xl hover:bg-slate-800" title="Ver Alertas">
            🔔
            <span id="pending-alerts-badge" class="hidden absolute top-1 right-1 w-4 h-4 bg-red-500 text-white text-[9px] font-black rounded-full flex items-center justify-center">0</span>
          </button>
        </div>

      </div>

      <!-- Barra de pestañas horizontales -->
      <nav class="flex space-x-1 py-2 overflow-x-auto text-xs sm:text-sm no-scrollbar border-t border-slate-800">
        <button data-action="switch-tab" data-id="dashboard" data-nav-tab="dashboard">
          📊 Dashboard & Semáforo
        </button>
        <button data-action="switch-tab" data-id="employees" data-nav-tab="employees">
          👥 Legajos (Personal)
        </button>
        <button data-action="switch-tab" data-id="skills" data-nav-tab="skills">
          🎯 Buscador de Skills
        </button>
        <button data-action="switch-tab" data-id="training" data-nav-tab="training">
          🎓 Agenda & Firmas
        </button>
        <button data-action="switch-tab" data-id="portal" data-nav-tab="portal">
          📱 Portal Móvil
        </button>
        <button data-action="switch-tab" data-id="reports" data-nav-tab="reports">
          📋 Auditoría & Exportar
        </button>
      </nav>
    </div>
  </header>

  <!-- Encabezado exclusivo para impresión de auditoría (print-only) -->
  <div class="hidden print-only p-6 border-b border-slate-300">
    <div class="flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">TalentTrack — Informe Oficial de RRHH</h1>
        <p class="text-xs text-slate-600">Registro de Cumplimiento Normativo, Habilitaciones y Capacitaciones</p>
      </div>
      <div class="text-right text-xs text-slate-500">
        <p>Validez Legal y Auditoría Laboral</p>
        <p>Generado: <span id="print-date">Noviembre 2026</span></p>
      </div>
    </div>
  </div>

  <!-- Vista Principal Dinámica -->
  <main id="app-view" class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
    <div class="flex items-center justify-center h-64 text-slate-400">
      Cargando TalentTrack...
    </div>
  </main>

  <!-- Contenedor de Modales Dinámicos -->
  <div id="modal-container" class="hidden"></div>

  <!-- Contenedor de Alertas Toast -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Script principal de la aplicación -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
