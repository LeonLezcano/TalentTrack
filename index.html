<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TalentTrack - Gestión Integral de RRHH & Competencias</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👥</text></svg>">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2563eb">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./src/styles/app.css">
</head>
<body class="h-full flex flex-col font-sans text-slate-800 antialiased selection:bg-blue-500 selection:text-white">

  <!-- Encabezado de Navegación Autenticado (Cerrado por defecto) -->
  <header id="main-header" class="hidden no-print bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-40 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        
        <!-- Logo e Identidad -->
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-xl font-black shadow-inner">
            TT
          </div>
          <div>
            <div class="flex items-center gap-2">
              <span class="font-extrabold text-lg tracking-tight">TalentTrack</span>
              <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-blue-500/30 text-blue-300 border border-blue-400/30">v1.0.02</span>
            </div>
            <p id="header-company-name" class="text-[10px] text-slate-400 truncate max-w-[200px]"></p>
          </div>
        </div>

        <!-- Usuario Activo, Alertas y Cerrar Sesión -->
        <div class="flex items-center gap-3">
          <span id="header-user-name" class="text-xs font-semibold text-slate-300 hidden sm:block"></span>

          <!-- Campana de Alertas -->
          <button data-action="switch-tab" data-id="dashboard" class="relative p-2 text-slate-400 hover:text-white rounded-xl hover:bg-slate-800" title="Ver Alertas">
            🔔
            <span id="pending-alerts-badge" class="hidden absolute top-1 right-1 w-4 h-4 bg-red-500 text-white text-[9px] font-black rounded-full flex items-center justify-center">0</span>
          </button>

          <button data-action="logout" class="px-3 py-1.5 bg-slate-800 hover:bg-red-950 text-slate-300 hover:text-red-300 border border-slate-700 hover:border-red-800 rounded-xl text-xs font-semibold transition" title="Cerrar Sesión Segura">
            Salir
          </button>
        </div>

      </div>

      <!-- Barra de pestañas horizontales -->
      <nav id="header-nav-tabs" class="flex space-x-1 py-2 overflow-x-auto text-xs sm:text-sm no-scrollbar border-t border-slate-800">
        <button data-action="switch-tab" data-id="dashboard" data-nav-tab="dashboard">
          📊 Dashboard & Alertas
        </button>
        <button data-action="switch-tab" data-id="employees" data-nav-tab="employees">
          👥 Legajos (Personal)
        </button>
        <button data-action="switch-tab" data-id="skills" data-nav-tab="skills">
          🎯 Buscador de Skills
        </button>
        <button data-action="switch-tab" data-id="training" data-nav-tab="training">
          🎓 Agenda & Firmas
        </button>
        <button data-action="switch-tab" data-id="epp" data-nav-tab="epp">
          🦺 EPP & Dotación
        </button>
        <button data-action="switch-tab" data-id="reports" data-nav-tab="reports">
          📋 Auditoría & Exportar
        </button>
      </nav>
    </div>
  </header>

  <!-- Encabezado de Impresión Limpia (print-only) -->
  <div class="hidden print-only p-6 border-b border-slate-300">
    <div class="flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">TalentTrack — Acta Oficial de RRHH</h1>
        <p class="text-xs text-slate-600">Registro de Cumplimiento Normativo, Habilitaciones y Capacitaciones</p>
      </div>
      <div class="text-right text-xs text-slate-500">
        <p>Validez Laboral y Cumplimiento Normativo</p>
        <p>Impreso: Noviembre 2026</p>
      </div>
    </div>
  </div>

  <!-- Vista Principal Dinámica -->
  <main id="app-view" class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8"></main>

  <!-- Modales Dinámicos -->
  <div id="modal-container" class="hidden"></div>

  <!-- Alertas Toast -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Script principal -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
